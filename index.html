<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Site Temporariamente Indisponível</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            background: #09263A;
        }

        .page {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
        }

        .page::before {
            content: "";
            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    rgba(9, 38, 58, 0.78),
                    rgba(9, 38, 58, 0.82)
                ),
                url("fundo.jpg");

            background-size: cover;
            background-position: center;

            animation: zoom 18s ease-in-out infinite alternate;

            z-index: -1;
        }

        .content {
            width: min(700px, 90%);
            padding: 40px 20px;

            animation: entrada 1.2s ease forwards;
        }

        .icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 25px;

            border: 3px solid #278E6F;
            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 32px;

            animation: pulse 2.5s infinite;
        }

        h1 {
            font-size: clamp(2rem, 6vw, 4.5rem);
            line-height: 1.05;
            margin-bottom: 20px;
        }

        h1 span {
            color: #278E6F;
        }

        p {
            font-size: clamp(1rem, 2vw, 1.2rem);
            line-height: 1.7;
            color: rgba(255,255,255,0.88);
        }

        .line {
            width: 90px;
            height: 4px;
            background: #278E6F;
            margin: 30px auto;
            border-radius: 10px;

            animation: loading 2s infinite alternate;
        }

        .copyright {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);

            width: 90%;

            font-size: 12px;
            letter-spacing: 1px;

            color: rgba(255,255,255,0.65);
        }

        .copyright strong {
            color: #278E6F;
        }

        @keyframes zoom {

            from {
                transform: scale(1.02);
            }

            to {
                transform: scale(1.10);
            }

        }

        @keyframes entrada {

            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        @keyframes pulse {

            0%, 100% {
                box-shadow: 0 0 0 0 rgba(39,142,111,0.5);
            }

            50% {
                box-shadow: 0 0 0 15px rgba(39,142,111,0);
            }

        }

        @keyframes loading {

            from {
                width: 60px;
            }

            to {
                width: 140px;
            }

        }

        @media (max-width: 600px) {

            .content {
                padding: 30px 15px;
            }

            .icon {
                width: 65px;
                height: 65px;
                font-size: 27px;
            }

            .copyright {
                font-size: 10px;
            }

        }

    </style>
</head>

<body>

    <main class="page">

        <section class="content">

            <div class="icon">
                !
            </div>

            <h1>
                Site temporariamente<br>
                <span>indisponível.</span>
            </h1>

            <p>
                Este website encontra-se temporariamente indisponível
                enquanto concluímos os últimos procedimentos administrativos
                do projeto.
            </p>

            <div class="line"></div>

        </section>

        <div class="copyright">
            © 2026 <strong>Kutxi Tec</strong> — Todos os direitos reservados
        </div>

    </main>

</body>
</html>
